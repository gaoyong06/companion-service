server:
  http:
    network: tcp
    addr: 0.0.0.0:8131
    timeout: 120s
  grpc:
    network: tcp
    addr: 0.0.0.0:9131
    timeout: 120s
data:
  database:
    source_env: COMPANION_DATABASE_DSN
    max_idle_conns: 10
    max_open_conns: 50
model_gateway:
  grpc_addr: model-gateway:9130
  timeout: 120s
  api_key_env: MODEL_GATEWAY_INBOUND_API_KEY
asset_service:
  grpc_addr: asset-service:9104
  timeout: 600s
  app_id: companion-service
memory:
  enabled: true
  queue_size: 100
  embedding_dimension: 1536
queue:
  enabled: true
  driver: rocketmq
  name_servers:
    - rocketmq-namesrv:9876
  group_name: companion_memory
  topic: companion_memory_extract
log:
  level: info
  format: json
  output: stdout
