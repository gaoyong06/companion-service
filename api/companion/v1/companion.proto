syntax = "proto3";

package companion.v1;

option go_package = "companion-service/api/companion/v1;v1";

import "google/api/annotations.proto";

service Companion {
  rpc GetTimeline(GetTimelineRequest) returns (TimelineReply) {
    option (google.api.http) = {
      get: "/companion/v1/timeline"
    };
  }

  rpc SendMessage(SendMessageRequest) returns (SendMessageReply) {
    option (google.api.http) = {
      post: "/companion/v1/messages"
      body: "*"
    };
  }

  rpc SendMessageStream(SendMessageRequest) returns (stream MessageChunk);

  rpc SendAudioMessage(SendAudioMessageRequest) returns (SendAudioMessageReply) {
    option (google.api.http) = {
      post: "/companion/v1/audio-messages"
      body: "*"
    };
  }

  rpc SendMediaMessage(SendMediaMessageRequest) returns (SendMediaMessageReply);

  rpc SubmitMemoryFeedback(MemoryFeedbackRequest) returns (MemoryFeedbackReply) {
    option (google.api.http) = {
      post: "/companion/v1/memory-feedback"
      body: "*"
    };
  }
}

message ConversationMessage {
  string message_id = 1;
  string role = 2;
  string content = 3;
  string created_at = 4;
  repeated MessageAsset assets = 5;
}

message MessageAsset {
  string message_asset_id = 1;
  string asset_id = 2;
  string media_type = 3;
  string content_type = 4;
  string filename = 5;
  string url = 6;
  int64 size_bytes = 7;
}

message GetTimelineRequest {
  int32 limit = 1;
}

message TimelineReply {
  repeated ConversationMessage messages = 1;
}

message SendMessageRequest {
  string content = 1;
}

message SendMessageReply {
  ConversationMessage user_message = 1;
  ConversationMessage assistant_message = 2;
}

message SendAudioMessageRequest {
  bytes audio_data = 1;
  string filename = 2;
  string content_type = 3;
  string language = 4;
  string voice = 5;
  bool synthesize = 6;
}

message SendAudioMessageReply {
  SendMessageReply message = 1;
  bytes audio_data = 2;
  string audio_content_type = 3;
}

message SendMediaMessageRequest {
  bytes data = 1;
  string filename = 2;
  string content_type = 3;
  string media_type = 4;
  string caption = 5;
  bool synthesize = 6;
  string voice = 7;
}

message SendMediaMessageReply {
  SendMessageReply message = 1;
}

message MessageChunk {
  string message_id = 1;
  string delta = 2;
  string finish_reason = 3;
  bool done = 4;
}

message MemoryFeedbackRequest {
  string message_id = 1;
  string action = 2;
  string kind = 3;
  string content = 4;
}

message MemoryFeedbackReply {
  bool accepted = 1;
}
